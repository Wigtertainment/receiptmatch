appId: com.wigtertainment.receiptmatch
productName: ReceiptMatch

directories:
  output: release

files:
  - .build/*.cjs
  - .build/ui/browser/**/*
  - .build/extraction/**/*
  - .build/preview/browser/**/*
  - package.json
  - LICENSE
extraResources:
  - from: .build/local-ocr-runtimes
    to: local-ocr-runtimes

asar: true
asarUnpack:
  - '**/*.node'

# better-sqlite3 13 ships Node-API prebuilds shared by Node and Electron.
npmRebuild: false

publish:
  provider: github
  owner: Wigtertainment
  repo: receiptmatch

win:
  executableName: ReceiptMatch
  signExecutable: false
  publish:
    provider: github
    owner: Wigtertainment
    repo: receiptmatch
    publisherName: [Wigtertainment Ltd]

nsis:
  artifactName: ReceiptMatch-Setup-${version}-windows-x64.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  executableName: receiptmatch
  artifactName: ReceiptMatch-${version}-linux-x64.${ext}
  category: Office
  maintainer: Wigtertainment
  syncDesktopName: true
