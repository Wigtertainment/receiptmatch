appId: com.wigtertainment.receiptmatch
productName: ReceiptMatch
extraMetadata:
  author:
    name: Wigtertainment Ltd
copyright: Copyright © 2026 Egor Kin

directories:
  output: release

files:
  - .build/*.cjs
  - .build/ui/browser/**/*
  - .build/extraction/**/*
  - .build/preview/browser/**/*
  - package.json
  - LICENSE
extraResources:
  - from: .build/local-ocr-runtimes
    to: local-ocr-runtimes

asar: true
asarUnpack:
  - '**/*.node'

# better-sqlite3 13 ships Node-API prebuilds shared by Node and Electron.
npmRebuild: false

publish:
  provider: github
  owner: Wigtertainment
  repo: receiptmatch

win:
  executableName: ReceiptMatch
  icon: media/receiptmatch/receiptmatch.ico
  signExecutable: false
  publish:
    provider: github
    owner: Wigtertainment
    repo: receiptmatch
    publisherName: [Wigtertainment Ltd]

nsis:
  artifactName: ReceiptMatch-Setup-${version}-windows-x64.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: media/receiptmatch/receiptmatch.ico
  uninstallerIcon: media/receiptmatch/receiptmatch.ico
  installerHeader: media/receiptmatch/installer-header.bmp
  installerSidebar: media/receiptmatch/installer-sidebar.bmp
  include: media/receiptmatch/installer.nsh
  shortcutName: ReceiptMatch
  uninstallDisplayName: ReceiptMatch
  uninstallUrlHelp: https://github.com/Wigtertainment/receiptmatch/issues

linux:
  executableName: receiptmatch
  icon: media/receiptmatch/linux-icons
  artifactName: ReceiptMatch-${version}-linux-x64.${ext}
  category: Office
  maintainer: Wigtertainment Ltd
  syncDesktopName: true
